name: DevSecOps Code Quality Pipeline (.NET Framework)

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build_and_analyze:
    name: Build, Analyze & Verify Compilation
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1
        with:
          nuget-version: 'latest'

      - name: Restore NuGet packages
        run: nuget restore .\TPINT_GRUPO_5_PR3\TPINT_GRUPO_5_PR3.slnx

      - name: Build solution
        run: |
          msbuild .\TPINT_GRUPO_5_PR3\TPINT_GRUPO_5_PR3.slnx `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:DeployOnBuild=false `
            /p:WebPublishMethod=None `
            /m `
            /v:minimal

      - name: Setup .NET for Security Code Scan
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Run Security Code Scan (Self-Contained SAST)
        run: |
          dotnet tool install --global SecurityCodeScan.Tool --version 5.6.0
          
          msbuild .\TPINT_GRUPO_5_PR3\TPINT_GRUPO_5_PR3.slnx `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:DeployOnBuild=false `
            /p:WebPublishMethod=None `
            /m `
            /v:minimal `
            /p:EnableSecurityCodeScan=true `
            /p:SecurityCodeScanAutoFix=false