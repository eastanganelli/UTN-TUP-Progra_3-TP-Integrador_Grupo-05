name: OpenGrep Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  opengrep-scan:
    name: Run OpenGrep
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OpenGrep
        # pipx natively handles downloading the wrapper, the core engine, and updating the $PATH
        run: pipx install opengrep

      - name: Run OpenGrep Scan
        run: |
          set +e
          
          opengrep scan --config auto --json -o opengrep-report.json .
          
          SCAN_EXIT_CODE=$?
          set -e
          
          echo "========================================"
          echo "         OpenGrep Scan Findings         "
          echo "========================================"
          
          if [ -s opengrep-report.json ]; then
            jq -r 'if (.results | length) > 0 then (.results[] | "[\(.extra.severity | ascii_upcase)] \(.path) (Line \(.start.line))\nRule: \(.check_id)\nMessage: \(.extra.message)\n---") else "✅ No vulnerabilities found!" end' opengrep-report.json
          else
            echo "Error: opengrep-report.json was not generated."
          fi
          
          exit $SCAN_EXIT_CODE

      - name: Upload Scan Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opengrep-report
          path: opengrep-report.json
          retention-days: 14
