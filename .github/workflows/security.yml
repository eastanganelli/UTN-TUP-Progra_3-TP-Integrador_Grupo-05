name: OpenGrep Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  opengrep-scan:
    name: Run OpenGrep
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OpenGrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | sudo bash

      - name: Run OpenGrep Scan
        run: |
          opengrep scan --verbose --json opengrep-report.json .

      - name: Upload Scan Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opengrep-report
          path: opengrep-report.json
          retention-days: 14
