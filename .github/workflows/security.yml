name: OpenGrep Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  opengrep-scan:
    name: Run OpenGrep
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OpenGrep
        run: |
          wget -qO opengrep https://github.com/opengrep/opengrep/releases/latest/download/opengrep_manylinux_x86
          chmod +x opengrep
          sudo mv opengrep /usr/local/bin/opengrep

      - name: Run OpenGrep Scan
        run: |
          opengrep scan -f --config auto
