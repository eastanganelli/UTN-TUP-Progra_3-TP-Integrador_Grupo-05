name: Security Scan
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
   sast-scan:
    name: OpenGrep Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required to upload SARIF results

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install and Run OpenGrep
        run: |
          echo "Downloading OpenGrep..."
          wget https://github.com -O opengrep
          chmod +x opengrep
          
          echo "Running scan..."
          ./opengrep ci --sarif --sarif-output opengrep_report.sarif --config auto --suppress-errors
        shell: bash

      - name: Upload Scan Results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: opengrep_report.sarif
          category: opengrep-sast