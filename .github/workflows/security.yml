name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  opengrep-scan:
    name: Run OpenGrep
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OpenGrep
        run: |
          wget -qO opengrep https://github.com/opengrep/opengrep/releases/latest/download/opengrep_manylinux_x86
          chmod +x opengrep
          sudo mv opengrep /usr/local/bin/opengrep

      - name: Run OpenGrep Scan
        run: opengrep scan --config auto --json -o opengrep-report.json .

      - name: Upload Scan Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opengrep-report
          path: opengrep-report.json
          retention-days: 14
